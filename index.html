<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>人类群星闪耀时 · 时光之河</title>
<style>
/* ==================================================================
   人类群星闪耀时 —— 时光之河
   一片漆黑的宇宙，每一个历史事件是一颗星辰
   ================================================================== */
:root{
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong",
          "SimSun",Georgia,"Times New Roman",serif;
  --ink:#cfd9e8;
  --ink-soft:#9fb0c8;
  --ink-dim:#6b7a90;
  --glow:rgba(150,185,255,.55);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;background:#000;
  overscroll-behavior:none;
}
body{
  font-family:var(--serif);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
canvas#sky{
  position:fixed;inset:0;display:block;width:100%;height:100%;
  touch-action:none;cursor:grab;
}
canvas#sky.dragging{cursor:grabbing}
canvas#sky.pointing{cursor:pointer}

/* ── 年份提示（唯一常驻 UI） ── */
#year{
  position:fixed;left:44px;top:38px;z-index:10;pointer-events:none;
  font-family:var(--serif);font-size:16px;font-weight:400;
  color:var(--ink);letter-spacing:.36em;text-indent:.36em;
  text-shadow:0 0 22px var(--glow),0 0 64px rgba(120,155,225,.28);
  opacity:.9;white-space:nowrap;
  transition:opacity 1.2s ease;
}
#year::after{
  content:"";display:block;margin-top:11px;height:1px;width:72px;
  background:linear-gradient(90deg,rgba(190,212,245,.5),rgba(190,212,245,0));
}
@media (max-width:680px){
  #year{left:24px;top:26px;font-size:13.5px;letter-spacing:.28em}
}

/* ── 事件卡片 ── */
#card{
  position:fixed;z-index:20;
  width:min(384px,calc(100vw - 48px));
  padding:28px 30px 22px;
  background:rgba(9,13,23,.36);
  -webkit-backdrop-filter:blur(22px) saturate(135%);
  backdrop-filter:blur(22px) saturate(135%);
  border:1px solid rgba(178,204,246,.085);
  border-radius:3px;
  box-shadow:
    inset 0 0 70px rgba(92,132,212,.10),
    0 24px 80px rgba(0,0,0,.55);
  opacity:0;
  transform:translateY(18px) scale(.972);
  filter:blur(11px);
  transition:
    opacity .95s cubic-bezier(.19,.8,.3,1),
    transform .95s cubic-bezier(.19,.8,.3,1),
    filter .95s cubic-bezier(.19,.8,.3,1);
  pointer-events:none;
  will-change:opacity,transform,filter;
}
#card.on{opacity:1;transform:none;filter:blur(0);pointer-events:auto}

.c-year{
  font-size:11.5px;letter-spacing:.32em;text-indent:.32em;
  color:#c9b489;
  text-shadow:0 0 20px rgba(210,180,120,.45);
  margin-bottom:12px;
}
.c-title{
  font-size:22px;line-height:1.5;font-weight:500;
  color:#e9eff8;letter-spacing:.05em;
  text-shadow:0 0 26px rgba(160,195,255,.42),0 0 70px rgba(120,160,235,.20);
  margin-bottom:15px;
}
.c-rule{
  height:1px;width:100%;margin:0 0 15px;
  background:linear-gradient(90deg,rgba(178,204,246,.32),rgba(178,204,246,0));
}
.c-desc{
  font-size:14px;line-height:2.05;color:#b6c4d8;
  letter-spacing:.045em;
  text-shadow:0 0 18px rgba(120,150,210,.22);
  margin-bottom:20px;
}
.c-foot{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:11.5px;letter-spacing:.16em;color:var(--ink-dim);
}
.c-dot{
  width:5px;height:5px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 10px currentColor;background:currentColor;
}
.c-cat{color:#9fb0c8}
.c-src{
  margin-top:9px;font-size:11.5px;letter-spacing:.09em;
  color:#5f6c80;line-height:1.75;
}
@media (max-width:680px){
  #card{left:16px!important;right:16px;top:auto!important;bottom:22px;
        width:auto;padding:22px 22px 18px}
  .c-title{font-size:19px}
}

/* ==================================================================
   自动演出 —— 极简控制条（默然隐于角落，靠近才现身）
   ================================================================== */
#tourbar{
  position:fixed;right:30px;bottom:30px;z-index:30;
  display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  opacity:.55;transition:opacity .7s ease;
}
#tourbar.live{opacity:.74}
#tourbar:hover,#tourbar:focus-within,#tourbar.intro{opacity:1}
@media (hover:none){ #tourbar{opacity:.80} }

/* 每次打开时先自己现身片刻，免得找不到 */
#tourhint{
  font-family:var(--serif);font-size:11.5px;letter-spacing:.24em;text-indent:.24em;
  color:#c6d7ee;padding:5px 14px 5px 16px;border-radius:16px;
  background:rgba(10,15,26,.42);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(178,204,246,.15);
  text-shadow:0 0 20px rgba(150,190,255,.55);
  opacity:0;transition:opacity .9s ease;
  pointer-events:none;white-space:nowrap;
}
#tourbar.intro #tourhint{opacity:1;animation:hintBreath 2.8s ease-in-out infinite}
@keyframes hintBreath{ 0%,100%{opacity:.58} 50%{opacity:1} }

#tourbtn{
  width:50px;height:50px;border-radius:50%;padding:0;
  border:1px solid rgba(188,214,250,.36);
  background:rgba(12,18,30,.46);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#dde7f6;cursor:pointer;display:grid;place-items:center;
  box-shadow:
    0 0 0 1px rgba(126,166,232,.06),
    0 0 40px rgba(96,140,220,.26),
    inset 0 0 26px rgba(96,140,220,.11);
  transition:border-color .4s,box-shadow .4s,transform .25s,opacity .8s ease;
}
#tourbtn:hover{
  border-color:rgba(206,226,255,.62);
  box-shadow:
    0 0 0 1px rgba(126,166,232,.10),
    0 0 54px rgba(112,158,236,.42),
    inset 0 0 28px rgba(96,140,220,.16);
}
#tourbtn:active{transform:scale(.93)}
#tourbtn svg{width:18px;height:18px;display:block;fill:currentColor}

/* 播放按钮：演出一开始就自动隐去，让画面彻底干净。
   鼠标移近控制条即淡回（隐形时仍占位可悬停，所以不会误点到看不见的按钮）；
   暂停、拖动中断或演出结束后自动复位。
   触屏没有 hover 可用，故不隐藏，免得找不回来。 */
#tourbar.playing #tourbtn{opacity:0}
#tourbar.playing:hover #tourbtn,#tourbar.playing:focus-within #tourbtn{opacity:1}
@media (hover:none){ #tourbar.playing #tourbtn{opacity:.72} }

#tourmenu{
  display:flex;align-items:center;gap:4px;
  padding:4px 6px;border-radius:18px;
  background:rgba(10,15,26,.40);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(178,204,246,.11);
  opacity:0;transform:translateY(7px);pointer-events:none;
  transition:opacity .45s ease,transform .45s ease;
}
#tourbar:hover #tourmenu,#tourbar:focus-within #tourmenu{
  opacity:1;transform:none;pointer-events:auto;
}
.tspeed{
  font-family:var(--serif);font-size:11.5px;letter-spacing:.09em;
  color:#8fa2bd;background:none;border:1px solid transparent;
  border-radius:12px;padding:2px 9px;cursor:pointer;
  transition:color .3s,border-color .3s,background .3s;
}
.tspeed:hover{color:#cfdcef}
.tspeed.on{color:#e2ecfa;border-color:rgba(190,215,252,.34);background:rgba(120,160,230,.13)}
.tdiv{width:1px;height:13px;background:rgba(178,204,246,.16);margin:0 3px}
#tourmenu button[title]{letter-spacing:.04em;font-size:11px}

/* 演出进度：一条几乎看不见的发丝线 */
#tourprog{
  position:fixed;left:0;right:0;bottom:0;height:1px;z-index:29;
  background:linear-gradient(90deg,rgba(186,214,252,.62),rgba(186,214,252,.26));
  transform:scaleX(0);transform-origin:0 50%;
  opacity:0;transition:opacity 1.1s ease;pointer-events:none;
}
#tourprog.on{opacity:.26}

/* 收尾文字 */
#finale{
  position:fixed;inset:0;z-index:25;display:grid;place-items:center;
  pointer-events:none;opacity:0;filter:blur(13px);
  transition:opacity 2.6s ease,filter 2.6s ease;
}
#finale::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(820px,92vw);height:210px;
  background:radial-gradient(ellipse at center,rgba(2,4,9,.66),rgba(2,4,9,0) 72%);
  pointer-events:none;
}
#finale.on{opacity:1;filter:blur(0)}
#finale span{
  font-family:var(--serif);text-align:center;padding:0 24px;
  font-size:clamp(20px,3.4vw,34px);line-height:2;
  letter-spacing:.34em;text-indent:.34em;
  color:#eaf1fc;
  text-shadow:
    0 0 34px rgba(160,196,255,.55),
    0 0 92px rgba(118,158,234,.30),
    0 0 26px rgba(0,0,8,.92);
}
@media (max-width:680px){
  #tourbar{right:18px;bottom:18px}
  #finale span{font-size:18px;letter-spacing:.22em;text-indent:.22em}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div id="year">…</div>

<div id="card">
  <div class="c-year"></div>
  <div class="c-title"></div>
  <div class="c-rule"></div>
  <div class="c-desc"></div>
  <div class="c-foot">
    <span class="c-dot"></span><span class="c-cat"></span>
    <span class="c-sep" style="color:#4a5568">·</span><span class="c-reg"></span>
  </div>
  <div class="c-src"></div>
</div>

<div id="tourprog"></div>
<div id="finale"><span>群星闪耀，历史仍在继续。</span></div>

<div id="tourbar">
  <div id="tourhint">自动演出</div>
  <div id="tourmenu">
    <button class="tspeed" data-sp="0.5">0.5×</button>
    <button class="tspeed on" data-sp="1">1×</button>
    <button class="tspeed" data-sp="2">2×</button>
    <span class="tdiv"></span>
    <button class="tspeed" id="tmajor" title="只遍历重要星辰">只游重点</button>
  </div>
  <button id="tourbtn" aria-label="自动演出" title="自动演出">
    <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>
    <svg id="icPause" viewBox="0 0 24 24" style="display:none"><path d="M8.2 5h2.9v14H8.2zM12.9 5h2.9v14h-2.9z"/></svg>
  </button>
</div>

<script>
/* ==================================================================

   ================================================================== */
const ANCH = [
  [-1800000,0.000],[-1000000,0.010],[-300000,0.022],[-100000,0.048],
  [-50000,0.070],[-20000,0.092],[-10000,0.110],[-5000,0.138],
  [-3000,0.166],[-1000,0.218],[0,0.252],[500,0.291],[1000,0.336],
  [1500,0.410],[1700,0.480],[1800,0.550],[1900,0.650],[1945,0.760],
  [1980,0.845],[2000,0.920],[2020,0.985],[2025,1.000]
];
const L = 60000;   /* 星河总长（世界单位） */

function yearToU(y){
  if(y <= ANCH[0][0]) return 0;
  for(let i=1;i<ANCH.length;i++){
    if(y <= ANCH[i][0]){
      const [y0,t0]=ANCH[i-1], [y1,t1]=ANCH[i];
      let f = (y-y0)/(y1-y0);
      f = Math.pow(f, 0.82);              /* 段内轻微非线性，近端更舒展 */
      return (t0 + (t1-t0)*f) * L;
    }
  }
  return L;
}
function uToYear(u){
  const t = Math.max(0, Math.min(1, u/L));
  if(t <= ANCH[0][1]) return ANCH[0][0];
  for(let i=1;i<ANCH.length;i++){
    if(t <= ANCH[i][1]){
      const [y0,t0]=ANCH[i-1], [y1,t1]=ANCH[i];
      let f = (t-t0)/(t1-t0);
      f = Math.pow(f, 1/0.82);
      return Math.round(y0 + (y1-y0)*f);
    }
  }
  return ANCH[ANCH.length-1][0];
}

/* 河心线的蜿蜒 */
function riverY(u){
  return 340*Math.sin(u/8200)
       + 170*Math.sin(u/2900 + 1.7)
       +  58*Math.sin(u/1050 + 3.9);
}

/* ==================================================================
   布局：沿河排布星辰
   同一类别的史事共享一条「丝带」相位，因而在时间上相邻的同主题星辰
   会自然汇成一股流动的支流；重要度越高，越靠近河心。
   ================================================================== */
function hash01(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h>>>0) % 100003) / 100003;
}
const CATSEED = {war:0.35, ref:2.05, rev:3.62, sci:5.05, cul:0.92, peo:4.28};

(function layout(){
  const placed = [];
  for(const e of EV){
    e.u  = yearToU(e.y);
    e.cy = riverY(e.u);

    /* 沿河平滑的丝带相位 */
    const sd = CATSEED[e.c] || 0;
    const ribbon = Math.sin(e.u*0.00040 + sd)*0.66
                 + Math.sin(e.u*0.00107 + sd*1.9)*0.34;
    /* 个体抖动：越不重要的星辰，偏离河心越远 */
    const jit = (hash01(e.n + '·j')*2 - 1) * (100 + 440*(1 - Math.min(1, e.imp)));
    const base = ribbon*350 + jit;

    /* 与近邻碰撞时，沿垂直方向让位 */
    const cands = [0];
    for(let s=1;s<=8;s++) cands.push(s*46, -s*46);
    cands.push(420,-420,500,-500,600,-600,720,-720,860,-860,1020,-1020);
    let pick = null;
    for(const d of cands){
      const off = base + d;
      let ok = true;
      for(let i=placed.length-1;i>=0;i--){
        const p = placed[i];
        if(e.u - p.u > 80) break;
        if(Math.abs(p.off - off) < 44){ ok = false; break; }
      }
      if(ok){ pick = off; break; }
    }
    if(pick === null) pick = base + (Math.random()*2-1) * 1000;
    e.off = pick;
    e.y0  = e.cy + pick;
    placed.push(e);
  }
})();

/* 星座连线：同类别、时空相邻的星辰之间，若隐若现 */
const LINKS = (function(){
  const pairs = [];
  for(let i=0;i<EV.length;i++){
    for(let j=i+1;j<EV.length;j++){
      const du = EV[j].u - EV[i].u;
      if(du > 620) break;
      if(EV[i].c !== EV[j].c) continue;
      const dy = EV[j].y0 - EV[i].y0;
      const d2 = du*du + dy*dy;
      if(d2 < 430*430) pairs.push([i,j,d2]);
    }
  }
  pairs.sort((a,b)=>a[2]-b[2]);
  const deg = new Array(EV.length).fill(0);
  const out = [];
  for(const [i,j] of pairs){
    if(out.length >= 780) break;
    if(deg[i] >= 2 || deg[j] >= 2) continue;
    deg[i]++; deg[j]++;
    out.push([EV[i], EV[j]]);
  }
  return out;
})();

(function makeSprites(){
  /* rgb 与 core 都是 'r,g,b' 字符串。类别一律纯白核，形状与从前逐像素一致；
     专属配色换个带本色的核，红／蓝才不会全被白核冲成白色。 */
  const sprite = (rgb, core) => {
    const S = 128, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g2 = cv.getContext('2d');
    const gr = g2.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    gr.addColorStop(0.00,'rgba('+core+',1)');
    gr.addColorStop(0.07,'rgba('+core+',.92)');
    gr.addColorStop(0.16,'rgba('+rgb+',.62)');
    gr.addColorStop(0.34,'rgba('+rgb+',.17)');
    gr.addColorStop(0.62,'rgba('+rgb+',.042)');
    gr.addColorStop(1.00,'rgba('+rgb+',0)');
    g2.fillStyle = gr;
    g2.fillRect(0,0,S,S);
    return cv;
  };
  for(const k of CCODES) SPR[CAT[k].c] = sprite(hexRGB(CAT[k].c), '255,255,255');
  for(const key in ACCENT){
    const a = ACCENT[key];
    SPR[a.col] = sprite(hexRGB(a.col), a.core);
  }
  /* 背景恒星用的小白点 */
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g3 = s.getContext('2d');
  const gr2 = g3.createRadialGradient(32,32,0,32,32,32);
  gr2.addColorStop(0,'rgba(255,255,255,1)');
  gr2.addColorStop(0.22,'rgba(214,228,248,.55)');
  gr2.addColorStop(1,'rgba(180,205,240,0)');
  g3.fillStyle = gr2; g3.fillRect(0,0,64,64);
  SPR.__bg = s;
})();

/* 星云贴图 */
function makeNebula(rgb, seed){
  const S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const blobs = 5;
  for(let i=0;i<blobs;i++){
    const a = seed*2.4 + i*1.9;
    const cx = S/2 + Math.cos(a)*(18 + (i%3)*14);
    const cy = S/2 + Math.sin(a*1.3)*(18 + (i%2)*20);
    const r  = 52 + (i%4)*20;
    const gr = g.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,'rgba('+rgb+',.5)');
    gr.addColorStop(0.45,'rgba('+rgb+',.16)');
    gr.addColorStop(1,'rgba('+rgb+',0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill();
  }
  return cv;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  RIV.width  = Math.max(2, Math.round(W/2));
  RIV.height = Math.max(2, Math.round(H/2));
  k0 = W / Math.max(5000, Math.min(W*6.5, 11000));
  if(!cam._init){ cam._init = true; k = k0; cam.x = yearToU(1870); }
}
window.addEventListener('resize', resize);

/* 世界坐标 → 屏幕坐标 */
const PX = u => (u - cam.x)*k + W/2;
const PY = y => (y - cam.y)*k + H/2;

/* 年份格式化 */
function fmtYear(y){
  if(y <= -10000) return '约 前' + Math.round(-y/10000) + ' 万年';
  if(y < 0)       return '公元前 ' + (-y) + ' 年';
  if(y === 0)     return '公元元年';
  return '公元 ' + y + ' 年';
}
function fmtYearTight(y){
  if(y <= -10000) return '前' + Math.round(-y/10000) + '万年';
  if(y < 0)       return '前' + (-y);
  return '' + y;
}

/* ── 绘制：深空底 ── */
function drawVoid(t){
  const cx = W*0.5 + Math.sin(t*0.00006)*W*0.10;
  const cy = H*0.5 + Math.cos(t*0.000045)*H*0.10;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.95);
  g.addColorStop(0.00,'#080c16');
  g.addColorStop(0.34,'#05080f');
  g.addColorStop(0.70,'#020407');
  g.addColorStop(1.00,'#000000');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* ── 绘制：星云 ── */
function drawNebulae(t){
  ctx.globalCompositeOperation = 'lighter';
  for(const n of NEB){
    const sx = PX(n.u), sy = PY(n.y);
    const rr = n.r * k * 1.6;
    if(sx + rr < -200 || sx - rr > W+200 || sy + rr < -200 || sy - rr > H+200) continue;
    const d = 1 + 0.10*Math.sin(t*0.00007 + n.u*0.0001);
    ctx.globalAlpha = n.a * (0.72 + 0.28*Math.sin(t*0.00009 + n.y*0.001));
    ctx.drawImage(n.spr, sx-rr*d, sy-rr*d, rr*2*d, rr*2*d);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：背景恒星 ── */
function drawBgStars(t){
  ctx.globalCompositeOperation = 'lighter';
  for(const L2 of BGL){
    for(const s of L2.arr){
      const ox = cam.x * k * L2.p;
      const oy = cam.y * k * L2.p;
      let sx = (s.x - ox) % W; if(sx < 0) sx += W;
      let sy = (s.y - oy) % H; if(sy < 0) sy += H;
      const tw = 0.55 + 0.45*Math.sin(t*s.sp + s.ph);
      const rr = s.r * (0.7 + 0.5*tw);
      ctx.globalAlpha = s.a * (0.45 + 0.55*tw) * 0.62;
      const g = rr*3.1;
      ctx.drawImage(SPR.__bg, sx-g, sy-g, g*2, g*2);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：时光之河 ── */
function drawRiver(t){
  const half = W/2/k;
  const u0 = Math.max(0, cam.x - half - 200);
  const u1 = Math.min(L, cam.x + half + 200);
  if(u1 <= u0) return;
  const step = Math.max(6, 11/k);
  const pts = [];
  for(let u=u0; u<=u1; u+=step) pts.push([PX(u), PY(riverY(u))]);
  if(pts.length < 2) return;

  const trace = c => {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0], pts[i][1]);
  };

  /* 柔光带在半分辨率的离屏画布上以模糊描边成形：
     既没有分层条纹，开销也只有全分辨率模糊的四分之一 */
  rctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  rctx.clearRect(0, 0, W, H);
  rctx.globalCompositeOperation = 'lighter';
  rctx.lineCap = 'round';
  rctx.lineJoin = 'round';
  if(rctx.filter !== undefined){
    rctx.filter = 'blur(58px)';
    rctx.strokeStyle = 'rgba(100,142,220,0.26)';
    rctx.lineWidth = 240;
    trace(rctx); rctx.stroke();
    rctx.filter = 'blur(22px)';
    rctx.strokeStyle = 'rgba(128,168,234,0.28)';
    rctx.lineWidth = 92;
    trace(rctx); rctx.stroke();
    rctx.filter = 'blur(9px)';
    rctx.strokeStyle = 'rgba(168,200,246,0.16)';
    rctx.lineWidth = 26;
    trace(rctx); rctx.stroke();
    rctx.filter = 'none';
  } else {
    rctx.strokeStyle = 'rgba(140,176,236,0.010)';
    for(let i=0;i<22;i++){
      rctx.lineWidth = 26 + 640*Math.pow(1 - i/21, 1.7);
      trace(rctx); rctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(RIV, 0, 0, W, H);

  /* 河心的清亮一线 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(198,220,252,.075)';
  ctx.lineWidth = 1.4;
  trace(ctx); ctx.stroke();

  /* 流动的光脉 */
  ctx.setLineDash([52, 148]);
  ctx.lineDashOffset = -(t*0.055) % 200;
  ctx.strokeStyle = 'rgba(212,232,255,.10)';
  ctx.lineWidth = 2.6;
  trace(ctx); ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：星尘 ── */
function drawDust(t){
  ctx.globalCompositeOperation = 'lighter';
  for(const d of DUST){
    const sx = PX(d.u), sy = PY(d.y);
    if(sx < -20 || sx > W+20 || sy < -20 || sy > H+20) continue;
    const tw = 0.45 + 0.55*Math.sin(t*d.sp + d.ph);
    ctx.globalAlpha = d.a * tw * Math.min(1, k/k0*1.6);
    const rr = Math.max(0.5, d.r * Math.min(1.5, Math.max(0.55, k/k0)));
    ctx.fillStyle = d.c;
    ctx.beginPath(); ctx.arc(sx, sy, rr, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：星座连线 ── */
function drawLinks(t){
  const fade = Math.min(1, Math.max(0, (k/k0 - 0.28) / 0.5));
  if(fade <= 0.02) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 0.75;
  for(const [a,b] of LINKS){
    const ax = PX(a.u), ay = PY(a.y0), bx = PX(b.u), by = PY(b.y0);
    if((ax < -80 && bx < -80) || (ax > W+80 && bx > W+80)) continue;
    if((ay < -80 && by < -80) || (ay > H+80 && by > H+80)) continue;
    const near = (a === hovered || b === hovered || a === sel || b === sel);
    /* 连线两端只要有一颗是专属配色，这条线就跟着它走 */
    ctx.strokeStyle = a.col || b.col || CAT[a.c].c;
    ctx.globalAlpha = (near ? 0.20 : 0.048) * fade;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：星辰 ── */
function drawStars(t){
  const zf = Math.min(1.35, Math.max(0.55, Math.pow(k/k0, 0.30)));
  const zAlpha = Math.min(1, Math.pow(k/k0, 0.45));   /* 远观时收敛亮度，免得糊成一片白 */
  ctx.globalCompositeOperation = 'lighter';
  for(const e of DRAW){
    const sx = PX(e.u), sy = PY(e.y0);
    e.sx = sx; e.sy = sy;
    if(sx < -70 || sx > W+70 || sy < -70 || sy > H+70){ e.vis = false; continue; }
    e.vis = true;

    const tl  = (e === tourNode) ? tourLit : 0;   /* 渐亮，不是开关 */
    const lit = (e === hovered) ? 1.42 : (1 + 0.16*tl);
    const tw  = 0.74 + 0.26*Math.sin(t*e.sp + e.ph);
    const hov = lit;
    const r   = (1.7 + 5.2*Math.pow(e.imp, 1.24)) * tw * zf * hov;
    e.r = r;

    const sp = SPR[starColor(e)];
    const g  = r*11;
    ctx.globalAlpha = 0.26 * tw * (e === hovered ? 1.7 : (1 + 0.40*tl)) * zAlpha;
    ctx.drawImage(sp, sx-g, sy-g, g*2, g*2);
    const c2 = r*2.7;
    ctx.globalAlpha = 0.96 * (0.60 + 0.40*zAlpha);
    ctx.drawImage(sp, sx-c2, sy-c2, c2*2, c2*2);

    /* 巨星的四芒 */
    if(e.imp >= 0.92){
      const a = 0.105 * tw * zf;
      const len = r*5.6, wid = Math.max(0.6, r*0.24);
      ctx.globalAlpha = a;
      ctx.fillStyle = starColor(e);
      ctx.fillRect(sx-len, sy-wid/2, len*2, wid);
      ctx.fillRect(sx-wid/2, sy-len, wid, len*2);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* 演出中被点亮的那颗星：柔和光晕 + 一圈圈缓缓荡开的光环 */
  if(tourNode && tourNode.vis && tourLit > 0.01){
    const r = Math.max(2.4, tourNode.r || 5);
    const breathe = 0.5 + 0.5*Math.sin(t*0.0026 + tourNode.ph);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = starColor(tourNode);
    ctx.lineWidth = 1.1;
    for(let i=0;i<3;i++){
      const ph = ((t*0.00040 + i/3) % 1);
      ctx.globalAlpha = 0.16 * (1-ph) * (0.55 + 0.45*breathe) * tourLit;
      ctx.beginPath();
      ctx.arc(tourNode.sx, tourNode.sy, r*(3.1 + ph*8.2), 0, 6.2832);
      ctx.stroke();
    }
    /* 光晕本身压得很淡：星核已经接近饱和，再加一片白就糊了 */
    const g = r*(9.0 + 2.4*breathe);
    ctx.globalAlpha = (0.13 + 0.08*breathe) * zAlpha * tourLit;
    ctx.drawImage(SPR[starColor(tourNode)], tourNode.sx-g, tourNode.sy-g, g*2, g*2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 悬停光环 */
  if(hovered && hovered.vis){
    const r = hovered.r;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = starColor(hovered);
    ctx.globalAlpha = 0.34;
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(hovered.sx, hovered.sy, r*3.4, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.arc(hovered.sx, hovered.sy, r*6.2, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    /* 星辰之名 */
    const nm = hovered.n.length > 16 ? hovered.n.slice(0,16)+'…' : hovered.n;
    ctx.font = '13px "Songti SC","Source Han Serif SC","Noto Serif SC",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const ty = hovered.sy + r*4.4 + 8;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.strokeText(nm, hovered.sx, ty);
    ctx.fillStyle = 'rgba(226,236,250,.94)';
    ctx.fillText(nm, hovered.sx, ty);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }
}

/* ── 绘制：绽放 ── */
function drawBlooms(t){
  if(!blooms.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for(let i=blooms.length-1;i>=0;i--){
    const b = blooms[i];
    const age = (t - b.t0) / 1700;
    if(age >= 1){ blooms.splice(i,1); continue; }
    const e = 1 - Math.pow(1-age, 3);
    /* 起势留一段淡入，否则第一帧就是一记白闪 */
    const atk = Math.min(1, age / 0.18);
    const sx = PX(b.u), sy = PY(b.y0);
    const R = e * 190;
    ctx.globalAlpha = (1-age) * 0.34 * atk;
    ctx.strokeStyle = b.c;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = (1-age) * 0.15 * atk;
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(sx, sy, R*0.62, 0, 6.2832); ctx.stroke();
    const g = (1-age) * 96;
    ctx.globalAlpha = (1-age) * 0.20 * atk;
    const sp = SPR[b.c];
    ctx.drawImage(sp, sx-g, sy-g, g*2, g*2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 绘制：流星 ── */
function spawnMeteor(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  const x = dir > 0 ? -180 + Math.random()*W*0.5 : W + 180 - Math.random()*W*0.5;
  const y = -120 + Math.random()*H*0.55;
  const ang = (dir > 0 ? 0.42 : Math.PI - 0.42) + (Math.random()-0.5)*0.22;
  const sp = 620 + Math.random()*760;
  meteors.push({
    x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    len: 170 + Math.random()*260, t0: performance.now(),
    life: 1500 + Math.random()*900
  });
}
function drawMeteors(t){
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    const age = (t - m.t0) / m.life;
    if(age >= 1){ meteors.splice(i,1); continue; }
    const dt = (t - m.t0) / 1000;
    const x = m.x + m.vx*dt, y = m.y + m.vy*dt;
    if(x < -500 || x > W+500 || y < -500 || y > H+500){ meteors.splice(i,1); continue; }
    const ang = Math.atan2(m.vy, m.vx);
    const tx = x - Math.cos(ang)*m.len, ty = y - Math.sin(ang)*m.len;
    const fade = Math.sin(Math.min(1,age)*Math.PI);
    const g = ctx.createLinearGradient(tx,ty,x,y);
    g.addColorStop(0,'rgba(180,210,255,0)');
    g.addColorStop(0.65,'rgba(205,225,255,'+(0.24*fade).toFixed(3)+')');
    g.addColorStop(1,'rgba(244,249,255,'+(0.62*fade).toFixed(3)+')');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,'+(0.5*fade).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x,y,1.3,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

   原为 6200ms／视野 26000（只看得到四成河段），今延长到 16000ms／整条河。 */

  '罗斯福诞生'                     /* 1882   新政与二战盟军领袖 */
];
const KEY_SET = new Set(KEY_TOUR);

/* ── 本模式的节奏 ── */
const KEY_HOLD_MS    = 1000;    /* 每颗重点星辰的停留基准：1 秒（中外完全一致）*/
const KEY_BUDGET_MS  = 900000;  /* 总时长上限：15 分钟 */
const KEY_COMFORT_MS = 240000;  /* 舒适下限：4 分钟，不足则整体放宽，见下 */
const KEY_STRETCH_MAX= 2.0;     /* 放宽上限，最多放宽到 2 倍 */
const KEY_MOVE_EST   = 1800;    /* 单次镜头位移的典型基准时长（未除倍速）*/
let   keyPace        = 1;       /* 统一的节奏系数：>1 放宽，<1 压缩，1 不变 */

function isKeyMode(){
  return tour.speed === 2 && tour.major;
}

/* 预估整场时长，得到统一的节奏系数：
   超出 15 分钟 → 等比压缩；不足 4 分钟 → 等比放宽（规格允许按总时长微调停留，
   但必须一致）。系数对序列中每一颗星辰一视同仁：中国节点与世界节点同比增减，
   绝不单动其中一方，也不做任何特殊突出。 */
function keyPaceCalc(list){
  if(!list.length) return 1;
  const sp  = tour.speed || 1;
  const per = KEY_HOLD_MS + (CARD_MS + GAP_MS + KEY_MOVE_EST) / sp;
  const all = list.length * per + 6200 / sp + 4200 / sp;   /* 含开场长途与收尾 */
  if(all > KEY_BUDGET_MS)  return KEY_BUDGET_MS / all;                       /* 压 */
  if(all < KEY_COMFORT_MS) return Math.min(KEY_STRETCH_MAX, KEY_COMFORT_MS / all); /* 放 */
  return 1;
}
/* ===== 2 倍速仅播重点模式修改——人物精简与平衡 —— 结束 ===== */

/* 巡游序列：按年代升序，可选只保留枢纽星辰 */
function tourList(){
  const base = EV.slice().sort((a,b) => a.y - b.y);
  if(!tour.major){
    keyPace = 1;                                   /* 2 倍速仅播重点模式修改 */
    return base;
  }
  if(isKeyMode()){                                 /* 2 倍速仅播重点模式修改——人物精简与平衡 */
    /* 取「名单 ∪ 原有世界重点（imp ≥ 0.9）」，严格按年代升序：
       精简后的人物、朝代节点与原有的世界重点星辰混编成一条连贯的时间脉络 */
    const sub = base.filter(e => KEY_SET.has(e.n) || e.imp >= 0.9);
    const out = sub.length ? sub : base;
    keyPace = keyPaceCalc(out);
    return out;
  }
  keyPace = 1;                                     /* 2 倍速仅播重点模式修改 */
  const sub = base.filter(e => e.imp >= 0.9);
  return sub.length ? sub : base;
}

/* 取景：让该星辰居中，并留出左右各约三个邻居的余地；
   缩放锚在当前的 k 上，保证镜头是连续推拉而非跳变 */
function tourTarget(){
  const list = tour.list, i = tour.idx, e = list[i];
  const lo = list[Math.max(0, i-3)];
  const hi = list[Math.min(list.length-1, i+3)];
  let span = Math.max(e.u - lo.u, hi.u - e.u) * 2.4;
  span = clampNum(span, 640, 5600);
  let tk = clampNum(W / span, W/72000, W/380);
  tk = clampNum(tk, k/1.5, k*1.5);
  return {x:e.u, y:e.y0, k:tk, e};
}

/* 停留时长：星辰越密集，停留越久（2 ~ 4 秒） */
function dwellFor(i){
  const list = tour.list, e = list[i];
  const p = list[i-1], n = list[i+1];
  const gap = Math.min(p ? e.u - p.u : 4000, n ? n.u - e.u : 4000);
  return clampNum(4200 - gap*7, 2000, 4000);
}

/* 位移时长：按屏幕上的实际行程计算，远则久，近则短 */
function moveFor(from, to){
  if(!from) return 1500;
  const d = Math.hypot((to.x - from.x)*to.k, (to.y - from.y)*to.k);
  return clampNum(1000 + d*1.35, 1200, 3400);
}

function tourSetPhase(ph, t){
  const list = tour.list;
  tour.phase = ph;
  tour.t0 = t;

  if(ph === 'move'){
    tourNode = list[tour.idx];
    closeCard();
    const tgt = tourTarget();
    tour.from = {x:cam.x, y:cam.y, k:k};
    tour.to   = tgt;
    tour.dur  = moveFor(tour.from, tgt);
    if(tour.fresh) tour.dur *= 2.1;          /* 开场那一跃，给足时间，像一次长途飞行 */
    tour.dur /= tour.speed;
    /* 2 倍速仅播重点模式修改——人物精简与平衡：
       只有超时压缩时镜头才同比略快；放宽节奏时镜头保持原速，
       依旧全程走 easeInOutCubic 缓动，绝不瞬移，并留出最短行程时间。 */
    if(isKeyMode() && keyPace < 1) tour.dur = Math.max(tour.dur * keyPace, 240);

  } else if(ph === 'hold'){
    /* 2 倍速仅播重点模式修改——人物精简与平衡：
       本模式每颗星辰的停留完全一致（中国人物、世界人物、朝代节点没有分别）。
       该停留是屏幕上的绝对时长，不再随 2× 倍速折算；
       keyPace 再对所有节点同比放宽或压缩，方向一致、幅度一致。 */
    tour.dur = isKeyMode() ? KEY_HOLD_MS * keyPace
                           : dwellFor(tour.idx) / tour.speed;

  } else if(ph === 'card'){
    /* 2 倍速仅播重点模式修改——人物精简与平衡：卡片时间同比增减，其余模式照旧 */
    tour.dur = isKeyMode() ? CARD_MS * keyPace / tour.speed
                           : CARD_MS / tour.speed;
    openCard(list[tour.idx]);

  } else if(ph === 'gap'){
    tour.dur = isKeyMode() ? GAP_MS * keyPace / tour.speed
                           : GAP_MS / tour.speed;
    closeCard();

  } else if(ph === 'finale'){
    tour.dur = FINALE_MS / tour.speed;
    closeCard();
    tourNode = null;
    tour.from = {x:cam.x, y:cam.y, k:k};
    /* 取景锚在河的正中（u = L/2，约公元 1722 年）：
       横向刚好收进整条河；纵向对到 0——河心线在 -407 ~ +517 之间摆动，
       星辰最多再偏离河心约 ±1150，取 0 便上下都有余量。 */
    tour.to = {x:L/2, y:0, k: W/(L*FINALE_VIEW)};
    finaleEl.classList.remove('on');         /* 文字先按住，等退得差不多了再浮上来 */
    progEl.style.transform = 'scaleX(1)';
  }
}

function tourTick(t){
  if(!tour.on) return;
  const list = tour.list;
  const p = Math.min(1, (t - tour.t0) / Math.max(1, tour.dur));

  /* 呼吸般的位移 */
  if(tour.phase === 'move' || tour.phase === 'finale'){
    const e = easeInOutCubic(p);
    cam.x = tour.from.x + (tour.to.x - tour.from.x)*e;
    cam.y = tour.from.y + (tour.to.y - tour.from.y)*e;
    k     = tour.from.k + (tour.to.k - tour.from.k)*e;
  }

  /* 进度发丝线 */
  if(tour.phase !== 'finale'){
    const done = (tour.idx + p) / Math.max(1, list.length);
    progEl.style.transform = 'scaleX(' + done.toFixed(4) + ')';
  } else if(p >= FINALE_TEXT_AT){
    /* 收尾文字：等镜头退到能看见整条河了才淡出来，不抢全貌 */
    finaleEl.classList.add('on');
  }

  if(p < 1) return;

  /* —— 相位推进 —— */
  if(tour.phase === 'move'){
    const cur = list[tour.idx];
    blooms.push({u:cur.u, y0:cur.y0, t0:t, c:starColor(cur)});
    tour.fresh = false;
    tourSetPhase('hold', t);
  } else if(tour.phase === 'hold'){
    tourSetPhase('card', t);
  } else if(tour.phase === 'card'){
    tourSetPhase('gap', t);
  } else if(tour.phase === 'gap'){
    tour.idx++;
    if(tour.idx >= list.length) tourSetPhase('finale', t);
    else tourSetPhase('move', t);
  } else if(tour.phase === 'finale'){
    tourEnd();
  }
}

function tourUI(){
  icPlay.style.display  = tour.on ? 'none' : 'block';
  icPause.style.display = tour.on ? 'block' : 'none';
  /* 暂停后仍保持可见，否则用户找不到「继续」 */
  barEl.classList.toggle('live', tour.on || tour.paused);
  /* 演出进行中让播放按钮自动隐去；停在暂停或结束时它自己回来 */
  barEl.classList.toggle('playing', tour.on);
  btnEl.title = tour.on ? '暂停演出' : (tour.paused ? '继续演出' : '自动演出');
}

/* 每次载入，控制条先自己现身片刻，7 秒后重新隐入角落 */
let hintTimer = null;
function showHint(ms){
  clearTimeout(hintTimer);
  barEl.classList.add('intro');
  hintTimer = setTimeout(() => barEl.classList.remove('intro'), ms);
}
showHint(7000);

function tourPlay(){
  if(tour.on) return;
  const now = performance.now();
  clearTimeout(hintTimer);
  barEl.classList.remove('intro');

  if(!tour.paused || !tour.list.length || tour.idx >= tour.list.length){
    /* 全新开始 */
    tour.list  = tourList();
    tour.idx   = 0;
    tour.fresh = true;
  } else {
    /* 从当前星辰附近续演：不重头，先合上卡片再飞到它身边 */
    tour.fresh = false;
  }
  tour.on = true;
  tour.paused = false;
  camVX = camVY = 0;
  /* 上次若正好停在收尾，文字先收回去，免得挂满整场 */
  finaleEl.classList.remove('on');
  progEl.classList.add('on');
  tourUI();
  tourSetPhase('move', now);
}

/* 用户一动手，演出即止 */
function tourPause(){
  if(!tour.on) return;
  tour.on = false;
  tour.paused = true;
  tourNode = null;
  closeCard();
  tourUI();
}

function tourEnd(){
  tour.on = false;
  tour.paused = false;
  tour.idx = 0;
  tour.list = [];
  tour.fresh = false;
  tourNode = null;
  closeCard();
  finaleEl.classList.remove('on');           /* 收尾文字缓缓消散 */
  progEl.classList.remove('on');
  progEl.style.transform = 'scaleX(0)';
  tourUI();
}

/* ── 控制条事件 ── */
btnEl.addEventListener('click', () => { tour.on ? tourPause() : tourPlay(); });

menuEl.querySelectorAll('[data-sp]').forEach(b => {
  b.addEventListener('click', () => {
    const ns = parseFloat(b.dataset.sp);
    const wasKey = isKeyMode();                    /* 2 倍速仅播重点模式修改 */
    if(tour.on && tour.dur > 0){
      /* 换算剩余时长，换挡时画面不跳 */
      const now = performance.now();
      const ratio = tour.speed / ns;
      tour.t0 = now - (now - tour.t0) * ratio;
      tour.dur = tour.dur * ratio;
    }
    tour.speed = ns;
    /* 2 倍速仅播重点模式修改——人物精简与平衡：
       只有在进出本模式（1×↔2× 且开了「只游重点」）时才重建序列；
       其余任何倍速切换都不碰序列，行为与原先完全一致。
       重建后从当前年份对应的星辰继续，镜头仍走缓动。 */
    if(isKeyMode() !== wasKey && (tour.on || tour.paused) && tour.list.length){
      const cur = tour.list[tour.idx];
      tour.list = tourList();
      let ni = 0;
      if(cur){
        ni = tour.list.findIndex(e => e.y >= cur.y);
        if(ni < 0) ni = 0;
      }
      tour.idx = Math.min(ni, Math.max(0, tour.list.length - 1));
    }
    menuEl.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b));
  });
});

document.getElementById('tmajor').addEventListener('click', function(){
  this.classList.toggle('on');
  tour.major = this.classList.contains('on');
  if(!tour.on && !tour.paused) return;
  const cur = tour.list[tour.idx];
  tour.list = tourList();
  if(cur){
    let ni = tour.list.findIndex(e => e.y >= cur.y);
    tour.idx = ni < 0 ? 0 : ni;
  } else {
    tour.idx = 0;
  }
});

tourUI();

/* ==================================================================
   主循环
   ================================================================== */
let yearShown = null;
let lastFrameT = 0;
function frame(){
  requestAnimationFrame(frame);
  const t = performance.now();
  const dt = Math.min(64, Math.max(1, t - lastFrameT));
  lastFrameT = t;

  /* 惯性 */
  if(!dragging && !tour.on && (Math.abs(camVX) > 0.01 || Math.abs(camVY) > 0.01)){
    cam.x -= camVX / k; cam.y -= camVY / k;
    camVX *= 0.935; camVY *= 0.935;
    if(Math.abs(camVX) < 0.02) camVX = 0;
    if(Math.abs(camVY) < 0.02) camVY = 0;
  }
  /* 演出中镜头由演出接管，不施加边界钳制 */
  if(!tour.on) cam.y = Math.max(-2600, Math.min(2600, cam.y));

  /* 自动演出 */
  tourTick(t);

  /* 点亮程度平滑升降（约 0.4 秒时间常数），这是消灭闪白的关键 */
  const wantLit = (tour.on && tourNode) ? 1 : 0;
  tourLit += (wantLit - tourLit) * (1 - Math.exp(-dt / 380));
  if(tourLit < 0.002) tourLit = 0;

  /* 流星 */
  if(t > nextMeteor){
    spawnMeteor();
    nextMeteor = t + 2600 + Math.random()*7200;
  }

  drawVoid(t);
  drawNebulae(t);
  drawBgStars(t);
  drawRiver(t);
  drawDust(t);
  drawLinks(t);
  drawStars(t);
  drawBlooms(t);
  drawMeteors(t);

  /* 悬停检测（演出中不响应，免得镜头扫过时满屏乱亮） */
  if(!dragging && pointer.active && !tour.on){
    const nh = pickAt(pointer.x, pointer.y);
    if(nh !== hovered){
      hovered = nh;
      cv.classList.toggle('pointing', !!hovered);
    }
  } else if(hovered && (dragging || !pointer.active || tour.on)) {
    hovered = null;
    cv.classList.remove('pointing');
  }

  /* 年份提示：平滑跟随视线中心 */
  const target = uToYear(cam.x);
  if(yearShown === null) yearShown = target;
  yearShown += (target - yearShown) * 0.12;
  if(Math.abs(target - yearShown) < 0.6) yearShown = target;
  const txt = fmtYear(Math.round(yearShown));
  if(yearEl.textContent !== txt) yearEl.textContent = txt;
  /* 退到整条河都在视野里时（收尾的「纵观星河」），一个点年份已说明不了问题，
     让标尺淡出去，画面只留那句收尾的话。文字仍照常更新，拉回来即复位。 */
  yearEl.style.opacity = (W/k > L*0.82) ? 0
                       : (k < k0*0.16 ? 0.55 : 0.9);
}

/* ==================================================================
   交互
   ================================================================== */
function zoomAt(mx, my, factor){
  const nk = Math.max(W/72000, Math.min(W/380, k*factor));
  if(nk === k) return;
  const wx = cam.x + (mx - W/2)/k;
  const wy = cam.y + (my - H/2)/k;
  k = nk;
  cam.x = wx - (mx - W/2)/k;
  cam.y = wy - (my - H/2)/k;
}

cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  tourPause();                                  /* 用户缩放，演出让位 */
  const f = Math.exp(-ev.deltaY * 0.0016);
  zoomAt(ev.clientX, ev.clientY, f);
}, {passive:false});

cv.addEventListener('pointerdown', ev => {
  tourPause();                                  /* 用户拖动，演出让位 */
  cv.setPointerCapture(ev.pointerId);
  touches.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if(touches.size === 1){
    dragging = true; moved = 0;
    pointer.id = ev.pointerId; pointer.sx = ev.clientX; pointer.sy = ev.clientY;
    camVX = camVY = 0;
    cv.classList.add('dragging');
  } else if(touches.size === 2){
    const [a,b] = [...touches.values()];
    pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
  }
});

cv.addEventListener('pointermove', ev => {
  pointer.active = true;
  if(touches.has(ev.pointerId)){
    const prev = touches.get(ev.pointerId);
    touches.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(touches.size === 1 && dragging){
      const dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
      moved += Math.abs(dx) + Math.abs(dy);
      cam.x -= dx/k; cam.y -= dy/k;
      camVX = dx; camVY = dy;
      pointer.x = ev.clientX; pointer.y = ev.clientY;
    } else if(touches.size === 2){
      const [a,b] = [...touches.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      if(pinchDist > 0) zoomAt(mx, my, d/pinchDist);
      pinchDist = d;
      moved = 999;
    }
  } else {
    pointer.x = ev.clientX; pointer.y = ev.clientY;
  }
});

/* 命中测试：找出指针附近的那颗星 */
function pickAt(mx, my){
  let best = null, bd = 1e9;
  for(const e of EV){
    if(!e.vis) continue;
    const dx = e.sx - mx, dy = e.sy - my;
    const d2 = dx*dx + dy*dy;
    if(d2 < bd){ bd = d2; best = e; }
  }
  const lim = best ? Math.max(24, best.r*4.2) : 24;
  return (bd < lim*lim) ? best : null;
}

function endPointer(ev){
  touches.delete(ev.pointerId);
  if(touches.size === 0){
    if(dragging && moved < 6){                 /* 视为点击 */
      const hit = pickAt(ev.clientX, ev.clientY) || hovered;
      if(hit) openCard(hit); else closeCard();
    }
    dragging = false;
    pinchDist = 0;
    cv.classList.remove('dragging');
  } else if(touches.size === 1){
    pinchDist = 0;
    const [only] = [...touches.values()];
    pointer.x = only.x; pointer.y = only.y;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => {
  if(!dragging){ pointer.active = false; hovered = null; cv.classList.remove('pointing'); }
});

/* ==================================================================
   卡片
   ================================================================== */
function openCard(e){
  sel = e;
  /* 演出途中那颗星已经亮着、且刚绽放过一次，不再叠第二次 */
  if(!tour.on) blooms.push({u:e.u, y0:e.y0, t0:performance.now(), c:starColor(e)});

  cardEl.querySelector('.c-year').textContent  = e.t;
  cardEl.querySelector('.c-title').textContent = e.n;
  cardEl.querySelector('.c-desc').textContent  = e.d;
  const dot = cardEl.querySelector('.c-dot');
  dot.style.color = starColor(e);            /* 专属配色时，卡片色点跟着星走 */
  cardEl.querySelector('.c-cat').textContent = CAT[e.c].n;
  cardEl.querySelector('.c-reg').textContent = REG[e.r] || '';
  cardEl.querySelector('.c-src').textContent = '信源 · ' + e.s;

  const wasOn = cardEl.classList.contains('on');

  /* 先在屏外量一次尺寸，再决定落点；此时仍是「未展开」的初始态 */
  cardEl.style.transition = 'none';
  cardEl.style.left = '-9999px';
  cardEl.style.top  = '-9999px';
  const r = cardEl.getBoundingClientRect();

  let x = -9999, y = -9999;
  if(W > 680){                                  /* 窄屏交给 CSS 底部对齐 */
    x = e.sx + 40; y = e.sy - r.height/2;
    if(x + r.width > W - 28) x = e.sx - r.width - 40;
    if(x < 28) x = 28;
    y = Math.max(30, Math.min(y, H - r.height - 30));
  }
  cardEl.style.left = x + 'px';
  cardEl.style.top  = y + 'px';

  if(wasOn){                                    /* 已展开：只换内容与位置，不重放动画 */
    cardEl.style.transition = '';
    return;
  }
  cardEl.classList.remove('on');
  void cardEl.offsetWidth;                      /* 让初始态落地 */
  cardEl.style.transition = '';                 /* 恢复过渡 */
  void cardEl.offsetWidth;
  cardEl.classList.add('on');                   /* 这才开始淡入 */
}
function closeCard(){
  sel = null;
  cardEl.classList.remove('on');
}

/* ==================================================================
   启动
   ================================================================== */
resize();
EV.forEach(e => { e.ph = Math.random()*6.283; e.sp = 0.0005 + Math.random()*0.0016; });
requestAnimationFrame(frame);
</script>
</body>
</html>
